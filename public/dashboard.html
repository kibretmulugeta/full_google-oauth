<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard & Task Manager</title>
  <meta name="description" content="User task management dashboard with Google profile authentication.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header Navbar -->
  <header class="navbar">
    <a href="/dashboard" class="nav-brand">
      <svg viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
      <span>Task Manager</span>
    </a>
    <div class="nav-actions">
      <a id="admin-switch-btn" href="/admin" class="btn-nav btn-admin-nav hidden">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
        <span>Admin Portal</span>
      </a>
      <a href="/auth/logout" class="btn-nav btn-logout">
        <span>Sign Out</span>
      </a>
    </div>
  </header>

  <main class="container-wide">
    <!-- Skeleton Loading -->
    <div id="loading-card" class="card">
      <div class="skeleton" style="height: 60px; width: 100%; margin-bottom: 20px;"></div>
      <div class="skeleton" style="height: 120px; width: 100%; margin-bottom: 20px;"></div>
      <div class="skeleton" style="height: 200px; width: 100%;"></div>
    </div>

    <!-- Active User Content -->
    <div id="dashboard-content" class="card card-dashboard hidden">
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="avatar-wrapper">
          <img id="user-avatar" class="avatar-img" src="" alt="Avatar" referrerpolicy="no-referrer" />
        </div>
        <div class="profile-meta">
          <div style="display: flex; align-items: center; gap: 8px;">
            <h2 id="user-display-name">Loading...</h2>
            <span id="user-role-badge" class="badge badge-user">USER</span>
          </div>
          <p id="user-email">email@example.com</p>
        </div>
      </div>

      <!-- Task Progress -->
      <div class="progress-card">
        <div class="progress-header">
          <span>Task Progress</span>
          <span id="progress-text">0 of 0 Completed</span>
        </div>
        <div class="progress-track">
          <div id="progress-bar-fill" class="progress-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Task Creation Form -->
      <div style="margin-bottom: 28px;">
        <h2>Create New Task</h2>
        <form id="create-task-form">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 12px;">
            <div>
              <input type="text" id="task-title-input" class="form-input" placeholder="Task Title *" required />
            </div>
            <div>
              <select id="task-priority-input" class="form-select">
                <option value="low">Priority: Low</option>
                <option value="medium" selected>Priority: Medium</option>
                <option value="high">Priority: High</option>
              </select>
            </div>
          </div>
          <div style="margin-bottom: 12px;">
            <input type="text" id="task-desc-input" class="form-input" placeholder="Task Description (Optional)" />
          </div>
          <button type="submit" class="btn-primary" style="width: auto; padding: 10px 24px;">+ Add Task</button>
        </form>
      </div>

      <!-- Filter Controls & Task List -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
          <h2>Your Tasks</h2>
          <div style="display: flex; gap: 8px;">
            <button id="filter-all" class="btn-sm active" style="background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4);" type="button">All</button>
            <button id="filter-pending" class="btn-sm" type="button">Pending</button>
            <button id="filter-completed" class="btn-sm" type="button">Completed</button>
          </div>
        </div>

        <div id="tasks-container" class="task-list">
          <div class="empty-state">Loading tasks...</div>
        </div>
      </div>

      <footer>
        Connected via MongoDB Atlas & Google OAuth 2.0
      </footer>
    </div>
  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>

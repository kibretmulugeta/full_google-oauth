<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard - Google OAuth Module</title>
  <meta name="description" content="Protected User Dashboard displaying Google profile details fetched via HttpOnly JWT cookie.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <!-- Skeleton Loading State -->
    <div id="loading-card" class="card">
      <div class="avatar-wrapper skeleton" style="border: none;"></div>
      <div class="skeleton" style="height: 28px; width: 60%; margin: 0 auto 12px auto;"></div>
      <div class="skeleton" style="height: 18px; width: 40%; margin: 0 auto 24px auto;"></div>
      <div class="skeleton" style="height: 120px; width: 100%; margin-bottom: 24px;"></div>
    </div>

    <!-- Active Profile Card -->
    <div id="profile-card" class="card hidden">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
        <span>Authenticated Session</span>
      </div>

      <div class="avatar-wrapper">
        <img id="user-avatar" class="avatar-img" src="" alt="User Avatar" />
      </div>

      <h1 id="user-display-name" class="user-name">Loading...</h1>
      <p id="user-email" class="user-email">email@example.com</p>

      <div class="info-grid">
        <div class="info-row">
          <span class="info-label">Account ID</span>
          <span id="info-id" class="info-value">...</span>
        </div>
        <div class="info-row">
          <span class="info-label">Google ID</span>
          <span id="info-google-id" class="info-value">...</span>
        </div>
        <div class="info-row">
          <span class="info-label">Member Since</span>
          <span id="info-created-at" class="info-value">...</span>
        </div>
      </div>

      <a id="logout-btn" href="/auth/logout" class="btn-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sign Out</span>
      </a>

      <footer>
        Connected via MongoDB Atlas & Google OAuth
      </footer>
    </div>
  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>
